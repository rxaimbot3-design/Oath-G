name: Build ASHTRON V7

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore AshtronV7/AshtronV7.csproj

    - name: Build and Publish
      run: |
        dotnet publish AshtronV7/AshtronV7.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:PublishTrimmed=false `
          -o publish

    - name: Upload ASHTRON_V7.exe as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ASHTRON_V7.exe
        path: publish/ASHTRON_V7.exe
        retention-days: 30

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: publish/ASHTRON_V7.exe
        generate_release_notes: true